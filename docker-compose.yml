name: paywall-lab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paywall
      POSTGRES_PASSWORD: paywall
      POSTGRES_DB: paywall
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paywall -d paywall"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: paywall-lab:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paywall:paywall@db:5432/paywall?sslmode=disable
      ENABLE_DEBUG_ENDPOINTS: "true"
      LOG_LEVEL: info
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
