name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet, test, lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paywall
          POSTGRES_PASSWORD: paywall
          POSTGRES_DB: paywall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paywall -d paywall"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://paywall:paywall@localhost:5432/paywall?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test (with the database-backed tests)
        run: go test -race -count=1 -cover ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  e2e:
    name: docker compose, API, contract and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium
      - name: Build the image
        run: docker compose build
      - name: Start app and database
        run: docker compose up -d --wait
      - name: API and contract tests
        run: pytest tests/api tests/contract --html=reports/api-contract.html --self-contained-html
      - name: Playwright E2E tests
        if: ${{ !cancelled() }}
        run: >-
          pytest tests/e2e
          --html=reports/e2e.html --self-contained-html
          --screenshot only-on-failure --tracing retain-on-failure --output reports/e2e-artifacts
      - name: App logs
        if: failure()
        run: docker compose logs app
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
      - name: Stop the stack
        if: ${{ !cancelled() }}
        run: docker compose down -v
